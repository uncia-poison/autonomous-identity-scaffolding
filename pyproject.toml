[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-identity-scaffolding"
version = "0.3.1"
description = "Event-sourced memory and self-authored identity scaffolding for local and API LLM agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Alina Pochinova"},
  {name = "KAi"},
]
license = {text = "All rights reserved"}
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
api = ["openai>=1.68"]
s3 = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]
all = ["openai>=1.68", "boto3>=1.35"]

[project.scripts]
ais = "ais.cli:main"
acs = "acs.cli:main"
continuity = "continuity_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acs = ["py.typed"]
ais = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

